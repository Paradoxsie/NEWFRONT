<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenFront-lite MVP</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hud topbar">
    <div><strong>Gold:</strong> <span id="gold">0</span></div>
    <div><strong>Population:</strong> <span id="pop">0</span> / <span id="cap">0</span></div>
    <div><strong>Land:</strong> <span id="land">0</span>%</div>
    <div><strong>Status:</strong> <span id="status">Running</span></div>
  </header>

  <section class="hud controls">
    <label>Workers %
      <input id="workerSlider" type="range" min="5" max="95" value="55" />
      <span id="workerPct">55%</span>
    </label>
    <label>Attack Ratio %
      <input id="attackSlider" type="range" min="5" max="90" value="20" />
      <span id="attackPct">20%</span>
    </label>
    <button id="buildCity">Build City (200g)</button>
    <button id="buildDefense">Build Defense Post (120g)</button>
  </section>

  <main>
    <canvas id="gameCanvas" width="1152" height="648" aria-label="territory map"></canvas>
  </main>

  <p class="hint">Left click enemy border to attack. Right click owned tile to build selected building.</p>

  <script src="game.js"></script>
</body>
</html>
