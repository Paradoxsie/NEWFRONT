<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEWFRONT MVP</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="hud">
      <div class="stats">
        <span id="gold">Gold: 0</span>
        <span id="pop">Pop: 0 / 0</span>
        <span id="land">Land: 0%</span>
      </div>
      <div class="controls">
        <label>Workers <input id="workerSlider" type="range" min="10" max="90" value="55" /> <span id="workerValue">55%</span></label>
        <label>Attack Ratio <input id="attackSlider" type="range" min="5" max="80" value="25" /> <span id="attackValue">25%</span></label>
      </div>
      <div class="buttons">
        <button id="buildCity">Build City (1200)</button>
        <button id="buildDefense">Build Defense Post (700)</button>
      </div>
    </header>

    <main class="game-wrap">
      <canvas id="gameCanvas" width="1152" height="648"></canvas>
      <canvas id="overlayCanvas" width="1152" height="648"></canvas>
      <aside class="legend">
        <h3>Controls</h3>
        <ul>
          <li>Left click enemy border tile: attack</li>
          <li>Left click your owned tile: select build tile</li>
          <li>Build City / Defense Post on selected owned tile</li>
        </ul>
      </aside>
    </main>

    <script src="./game.js"></script>
  </body>
</html>
